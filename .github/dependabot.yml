version: 2

updates:
  - package-ecosystem: bun
    directory: /apps/web

    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Almaty

    open-pull-requests-limit: 5

    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

    labels:
      - dependencies
      - frontend

  - package-ecosystem: bun
    directory: /apps/server

    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Almaty

    open-pull-requests-limit: 5

    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

    labels:
      - dependencies
      - server

  - package-ecosystem: github-actions
    directory: /

    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Almaty

    open-pull-requests-limit: 5

    groups:
      github-actions:
        patterns:
          - '*'

    labels:
      - dependencies
      - github-actions
