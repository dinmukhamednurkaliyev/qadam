version: 2

updates:
  - package-ecosystem: bun
    directory: /

    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Almaty

    open-pull-requests-limit: 5

    groups:
      # Group minor/patch updates; major versions stay separate for compatibility review.
      routine-version-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /

    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Almaty

    open-pull-requests-limit: 5

    groups:
      github-actions:
        patterns:
          - '*'

    labels:
      - dependencies
      - github-actions
