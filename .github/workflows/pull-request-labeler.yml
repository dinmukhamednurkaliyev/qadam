name: Pull Request Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  # Creating labels that do not yet exist requires issues: write.
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-pull-request:
    name: Label Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # This event has a write-capable token. Never check out or execute pull-request code here.
    # The labeler reads its configuration from the trusted base branch.
    steps:
      - name: Label Pull Request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
