name: Verify

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Verify Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: bun

      - name: Install Dependencies
        run: mise run install

      - name: Run Security Check
        run: mise run security:web

      - name: Validate and Build Web
        run: mise run verify:web

  server:
    name: Verify Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go

      - name: Validate, Test, and Build Server
        run: mise run verify:server

  verify:
    name: Verify
    needs: [web, server]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Results
        env:
          WEB_RESULT: ${{ needs.web.result }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          [[ "$WEB_RESULT" == "success" ]]
          [[ "$SERVER_RESULT" == "success" ]]
