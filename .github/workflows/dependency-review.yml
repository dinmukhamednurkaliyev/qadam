name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.3

      - name: Review Dependencies
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate