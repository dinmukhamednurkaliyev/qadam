changed-files-labels-limit: 5
max-files-changed: 100

web:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/web/**'

server:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/server/**'

shared:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/shared/**'

workspace:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'bun.lock'
          - 'mise.toml'
          - '.gitignore'
          - '.vscode/**'
          - 'stylelint.config.*'
          - 'apps/*/tsconfig*.json'
          - 'apps/*/vite.config.*'
          - 'packages/*/tsconfig*.json'

assets:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/*/public/**'

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Dockerfile'
          - 'Dockerfile.*'
          - 'compose.yml'
          - 'compose.yaml'
          - 'docker/**'
          - 'infrastructure/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'apps/*/package.json'
          - 'packages/*/package.json'
          - 'bun.lock'
          - 'package-lock.json'
          - 'pnpm-lock.yaml'
          - 'yarn.lock'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'documentation/**'
          - 'README.md'
          - 'LICENSE'
          - 'LICENSE.*'

environment:
  - changed-files:
      - any-glob-to-any-file:
          - '**/.env.example'
          - '**/.env.*.example'
