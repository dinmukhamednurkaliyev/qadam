name: Feature Request
description: Request new functionality
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this request to be complete?
    validations:
      required: true
