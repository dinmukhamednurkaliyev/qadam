name: Refactor Request
description: Request an internal code improvement
labels:
  - refactor

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be refactored?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed?
    validations:
      required: true